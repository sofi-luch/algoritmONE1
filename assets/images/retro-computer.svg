<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
    <!-- Apple II style computer -->
    <!-- Monitor -->
    <rect x="20" y="10" width="160" height="100" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
    <rect x="30" y="20" width="140" height="80" fill="#000"/>

    <!-- Screen content - Logo turtle graphics -->
    <rect x="35" y="25" width="130" height="70" fill="#001100"/>

    <!-- Grid on screen -->
    <line x1="35" y1="45" x2="165" y2="45" stroke="#003300" stroke-width="0.5"/>
    <line x1="35" y1="65" x2="165" y2="65" stroke="#003300" stroke-width="0.5"/>
    <line x1="70" y1="25" x2="70" y2="95" stroke="#003300" stroke-width="0.5"/>
    <line x1="100" y1="25" x2="100" y2="95" stroke="#003300" stroke-width="0.5"/>
    <line x1="130" y1="25" x2="130" y2="95" stroke="#003300" stroke-width="0.5"/>

    <!-- Turtle trail on screen -->
    <polyline points="100,70 100,50 120,50 120,70 100,70 100,30 140,30 140,80 80,80 80,20 150,20 150,90 70,90"
              fill="none" stroke="#00ff41" stroke-width="2"/>

    <!-- Turtle on screen -->
    <polygon points="100,65 105,75 95,75" fill="#ffb000" stroke="#00ff41" stroke-width="1"/>

    <!-- Command prompt on screen -->
    <text x="40" y="90" fill="#00ff41" font-family="monospace" font-size="8">APPLE LOGO READY</text>

    <!-- Computer base/keyboard -->
    <rect x="30" y="110" width="140" height="30" fill="#3a3a3a" stroke="#444" stroke-width="2"/>

    <!-- Keyboard keys -->
    <rect x="40" y="118" width="8" height="6" fill="#555"/>
    <rect x="52" y="118" width="8" height="6" fill="#555"/>
    <rect x="64" y="118" width="8" height="6" fill="#555"/>
    <rect x="76" y="118" width="8" height="6" fill="#555"/>
    <rect x="88" y="118" width="8" height="6" fill="#555"/>
    <rect x="100" y="118" width="8" height="6" fill="#555"/>
    <rect x="112" y="118" width="8" height="6" fill="#555"/>
    <rect x="124" y="118" width="8" height="6" fill="#555"/>
    <rect x="136" y="118" width="8" height="6" fill="#555"/>
    <rect x="148" y="118" width="8" height="6" fill="#555"/>

    <!-- Space bar -->
    <rect x="60" y="128" width="80" height="6" fill="#555"/>

    <!-- Floppy drive slot -->
    <rect x="150" y="115" width="15" height="3" fill="#222"/>

    <!-- Power LED -->
    <circle cx="35" cy="115" r="2" fill="#00ff41"/>

    <!-- Brand label -->
    <text x="100" y="145" fill="#888" font-family="monospace" font-size="8" text-anchor="middle">APPLE II</text>
</svg>