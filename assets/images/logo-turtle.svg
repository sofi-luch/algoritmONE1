<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <!-- Pixel art turtle in 1980s style -->
    <!-- Shell -->
    <rect x="16" y="16" width="32" height="32" fill="#2d5a27"/>
    <rect x="20" y="20" width="24" height="24" fill="#3d7a37"/>
    <rect x="24" y="24" width="16" height="16" fill="#4d9a47"/>

    <!-- Shell pattern -->
    <rect x="28" y="28" width="8" height="8" fill="#5daa57"/>
    <rect x="24" y="28" width="4" height="8" fill="#4d9a47"/>
    <rect x="36" y="28" width="4" height="8" fill="#4d9a47"/>
    <rect x="28" y="24" width="8" height="4" fill="#4d9a47"/>
    <rect x="28" y="36" width="8" height="4" fill="#4d9a47"/>

    <!-- Head -->
    <rect x="28" y="4" width="8" height="12" fill="#5daa57"/>
    <rect x="30" y="6" width="2" height="2" fill="#000"/>
    <rect x="34" y="6" width="2" height="2" fill="#000"/>

    <!-- Legs -->
    <rect x="8" y="20" width="8" height="8" fill="#5daa57"/>
    <rect x="48" y="20" width="8" height="8" fill="#5daa57"/>
    <rect x="8" y="36" width="8" height="8" fill="#5daa57"/>
    <rect x="48" y="36" width="8" height="8" fill="#5daa57"/>

    <!-- Tail -->
    <rect x="28" y="48" width="8" height="8" fill="#5daa57"/>
    <rect x="30" y="56" width="4" height="4" fill="#4d9a47"/>

    <!-- Outline -->
    <rect x="16" y="16" width="32" height="32" fill="none" stroke="#1a3a17" stroke-width="2"/>
    <rect x="28" y="4" width="8" height="12" fill="none" stroke="#1a3a17" stroke-width="2"/>
    <rect x="8" y="20" width="8" height="8" fill="none" stroke="#1a3a17" stroke-width="2"/>
    <rect x="48" y="20" width="8" height="8" fill="none" stroke="#1a3a17" stroke-width="2"/>
    <rect x="8" y="36" width="8" height="8" fill="none" stroke="#1a3a17" stroke-width="2"/>
    <rect x="48" y="36" width="8" height="8" fill="none" stroke="#1a3a17" stroke-width="2"/>
    <rect x="28" y="48" width="8" height="8" fill="none" stroke="#1a3a17" stroke-width="2"/>
</svg>